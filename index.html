    <!-- Firebase SDK CDN (Compat v10 for Realtime Database global access) -->

    <!-- Early PWA Install Prompt Capture, WebSocket error suppression & Service Worker Registration -->
    <script>
      // Gracefully suppress harmless Vite HMR WebSocket error in iframe preview environment
      window.addEventListener('error', function(e) {
        if (e && (e.message || '').includes('WebSocket closed without opened')) {
          if (typeof e.preventDefault === 'function') e.preventDefault();
          if (typeof e.stopImmediatePropagation === 'function') e.stopImmediatePropagation();
          return true;
        }
      }, true);
      window.addEventListener('unhandledrejection', function(e) {
        if (e && (e.reason?.message || '').includes('WebSocket closed without opened')) {
          if (typeof e.preventDefault === 'function') e.preventDefault();
          return true;
        }
      });

      // Capture PWA install prompt early before React components mount
      window.__pwaInstallPrompt = null;
      window.__pwaIsInstalled = Boolean(
        window.matchMedia('(display-mode: standalone)').matches ||
        window.navigator.standalone === true ||
        document.referrer.includes('android-app://')
      );

      window.addEventListener('beforeinstallprompt', function(e) {
        // Prevent default mini-infobar so our custom install button can trigger the native dialog
        e.preventDefault();
        window.__pwaInstallPrompt = e;
        window.dispatchEvent(new CustomEvent('pwa-prompt-ready', { detail: e }));
        console.log('[PWA] beforeinstallprompt captured and ready for button trigger');
      });

      window.addEventListener('appinstalled', function() {
        window.__pwaInstallPrompt = null;
        window.__pwaIsInstalled = true;
        window.dispatchEvent(new CustomEvent('pwa-app-installed'));
        console.log('[PWA] Application installed successfully into standalone mode');
      });

      // Register standard Service Worker reliably
      function registerSW() {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.register('/sw.js', { scope: '/' })
            .then(function(reg) {
              console.log('[PWA] Service Worker registered successfully with scope:', reg.scope);
            })
            .catch(function(err) {
              console.warn('[PWA] Service Worker registration failed:', err);
            });
        }
      }

      if (document.readyState === 'complete' || document.readyState === 'interactive') {
        registerSW();
      } else {
        window.addEventListener('DOMContentLoaded', registerSW);
      }
    </script>
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased selection:bg-blue-600 selection:text-white">

    <script type="module" src="/src/main.tsx"></script>
  </body>
