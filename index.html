<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="background-color" content="#020617" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="스피드토익" />

    <!-- PWA 및 리소스 연결 (상대 경로 ./ 적용) -->
    <link rel="manifest" href="./manifest.json" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="./pwa-192x192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="./pwa-512x512.png" />

    <title>스피드토익 타이머</title>
    <meta name="description" content="수강생 관리, 맞춤형 공부 타이머(아날로그 시계 기반), TOP 3 랭킹, 관리자 공지 및 디자인 제어가 통합된 토익 스터디 타이머 웹 애플리케이션" />

    <!-- 폰트 및 폰트 CDN -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700;800&display=swap" rel="stylesheet">

    <!-- Firebase SDK CDN -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

    <!-- PWA Install Prompt Capture -->
    <script>
      window.addEventListener('error', function(e) {
        if (e && (e.message || '').includes('WebSocket closed without opened')) {
          if (typeof e.preventDefault === 'function') e.preventDefault();
          if (typeof e.stopImmediatePropagation === 'function') e.stopImmediatePropagation();
          return true;
        }
      }, true);

      window.__pwaInstallPrompt = null;
      window.__pwaIsInstalled = Boolean(
        window.matchMedia('(display-mode: standalone)').matches ||
        window.navigator.standalone === true ||
        document.referrer.includes('android-app://')
      );

      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        window.__pwaInstallPrompt = e;
        window.dispatchEvent(new CustomEvent('pwa-prompt-ready', { detail: e }));
      });

      window.addEventListener('appinstalled', function() {
        window.__pwaInstallPrompt = null;
        window.__pwaIsInstalled = true;
        window.dispatchEvent(new CustomEvent('pwa-app-installed'));
      });
    </script>
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased selection:bg-blue-600 selection:text-white">
    <!-- PWA 설치 배너 -->
    <div id="pwa-install-banner" style="display: none; background: #2563eb; color: white; padding: 12px 16px; align-items: center; justify-content: space-between; font-family: sans-serif; position: sticky; top: 0; z-index: 9999;">
      <div style="font-weight: bold; font-size: 14px;">📱 SPEED TOEIC TIMER 앱 설치</div>
      <button id="pwa-install-btn" style="background: white; color: #2563eb; border: none; padding: 6px 14px; border-radius: 20px; font-weight: bold; font-size: 13px; cursor: pointer;">
        앱 설치
      </button>
    </div>
    <script>
      let deferredPrompt;
      const installBanner = document.getElementById('pwa-install-banner');
      const installBtn = document.getElementById('pwa-install-btn');

      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        if (installBanner) {
          installBanner.style.display = 'flex';
        }
      });

      if (installBtn) {
        installBtn.addEventListener('click', () => {
          if (deferredPrompt) {
            deferredPrompt.prompt();
            deferredPrompt.userChoice.then((choiceResult) => {
              if (choiceResult.outcome === 'accepted') {
                installBanner.style.display = 'none';
              }
              deferredPrompt = null;
            });
          }
        });
      }
    </script>

    <div id="root"></div>
    <!-- 앱 진입점 스크립트 (상대 경로 ./ 적용) -->
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
