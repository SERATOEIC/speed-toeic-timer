<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="16" y="16" width="480" height="480" rx="110" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="8"/>

  <!-- Clock Outer Dial -->
  <circle cx="256" cy="256" r="176" fill="#090d1f" stroke="#2563eb" stroke-width="6" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="162" fill="none" stroke="#1e293b" stroke-width="2"/>

  <!-- Ticks -->
  <line x1="256" y1="104" x2="256" y2="124" stroke="#e2e8f0" stroke-width="6" stroke-linecap="round"/>
  <line x1="408" y1="256" x2="388" y2="256" stroke="#e2e8f0" stroke-width="6" stroke-linecap="round"/>
  <line x1="256" y1="408" x2="256" y2="388" stroke="#e2e8f0" stroke-width="6" stroke-linecap="round"/>
  <line x1="104" y1="256" x2="124" y2="256" stroke="#e2e8f0" stroke-width="6" stroke-linecap="round"/>

  <!-- 15, 30, 45, 60 numbers -->
  <text x="256" y="152" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" font-weight="900" fill="#f8fafc">60</text>
  <text x="368" y="264" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" font-weight="900" fill="#f8fafc">15</text>
  <text x="256" y="376" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" font-weight="900" fill="#f8fafc">30</text>
  <text x="144" y="264" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" font-weight="900" fill="#f8fafc">45</text>

  <!-- Speed Arc Accent (0 to 15 min / 0 to 90 deg) -->
  <path d="M 256 112 A 144 144 0 0 1 400 256" fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" opacity="0.8"/>

  <!-- Hands -->
  <!-- Hour Hand (~10:10) -->
  <line x1="256" y1="256" x2="182" y2="182" stroke="#ffffff" stroke-width="12" stroke-linecap="round"/>
  <!-- Minute Hand (~2:10) -->
  <line x1="256" y1="256" x2="336" y2="216" stroke="#38bdf8" stroke-width="8" stroke-linecap="round"/>
  <!-- Second Hand (red) -->
  <line x1="256" y1="286" x2="256" y2="130" stroke="#ef4444" stroke-width="4" stroke-linecap="round"/>

  <!-- Center Pin -->
  <circle cx="256" cy="256" r="14" fill="#ef4444" stroke="#ffffff" stroke-width="4"/>
  <circle cx="256" cy="256" r="5" fill="#ffffff"/>
</svg>
